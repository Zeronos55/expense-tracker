{% extends "base.html" %}
{% block content %}

<div class="card" style="padding:12px;">
    <form method="get" style="display:flex; gap:8px;">
        <select name="month" onchange="this.form.submit()" style="flex:1; margin:0;">
            <option value="">All months</option>
            {% for m in months %}
            <option value="{{ m }}" {{ 'selected' if selected_month == m }}>{{ m }}</option>
            {% endfor %}
        </select>
        <select name="category" onchange="this.form.submit()" style="flex:1; margin:0;">
            <option value="">All categories</option>
            {% for c in categories %}
            <option value="{{ c }}" {{ 'selected' if selected_category == c }}>{{ c }}</option>
            {% endfor %}
        </select>
    </form>
</div>

{% if rows %}
    {% for row in rows %}
    <a href="/edit/{{ row.id }}" style="text-decoration:none; color:#1d1d1f;">
        <div class="card" style="padding:12px 16px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <p style="font-weight:600; font-size:15px;">{{ row.recipient }}</p>
                    <p style="font-size:12px; color:#86868b; margin-top:2px;">
                        {{ row.date }} · {{ row.category }}
                    </p>
                </div>
                <span style="font-weight:700; font-size:16px; color:#0071e3;">
                    RM {{ "%.2f"|format(row.amount) }}
                </span>
            </div>
        </div>
    </a>
    {% endfor %}
{% else %}
    <div class="card" style="text-align:center; padding:40px 16px;">
        <p style="color:#86868b;">No transactions found.</p>
    </div>
{% endif %}

{% endblock %}
