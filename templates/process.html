{% extends "base.html" %}
{% block content %}

<div class="card" style="text-align:center; padding:30px 16px;">
    <p style="font-size:48px; margin-bottom:12px;">📷</p>
    <p style="font-weight:600; font-size:16px; margin-bottom:8px;">Process Receipts</p>
    <p style="color:var(--ink-muted); font-size:14px; margin-bottom:24px;">
        Scans your iCloud receipts folder and saves any new images automatically.
    </p>
    <button class="btn btn-primary" onclick="runProcess()" id="runBtn">
        Scan Now
    </button>
</div>

<div id="results" style="display:none;">
    <div class="card">
        <p id="summary" style="font-weight:600; margin-bottom:12px;"></p>
        <div id="resultList"></div>
    </div>
</div>

<script>
function runProcess() {
    const btn = document.getElementById('runBtn');
    btn.textContent = 'Scanning...';
    btn.disabled = true;

    fetch('/process/run', { method: 'POST' })
        .then(r => r.json())
        .then(data => {
            document.getElementById('summary').textContent = data.summary;
            const list = document.getElementById('resultList');
            list.innerHTML = '';
            data.results.forEach(r => {
                const div = document.createElement('div');
                div.style = 'padding:8px 0; border-top:1px solid var(--border); font-size:14px;';
                if (r.status === 'saved') {
                    div.innerHTML = `<strong>${r.recipient}</strong> — RM ${r.amount}<br>
                                     <span style="color:var(--ink-muted)">${r.date} · ${r.category}</span>`;
                } else {
                    div.innerHTML = `<span style="color:var(--critical)">❌ ${r.file}: ${r.error}</span>`;
                }
                list.appendChild(div);
            });
            document.getElementById('results').style.display = 'block';
            btn.textContent = 'Scan Again';
            btn.disabled = false;
        });
}
</script>

{% endblock %}
