{% extends "base.html" %}
{% block content %}

<div class="card">
    <p style="font-size:12px; color:var(--ink-muted); margin-bottom:16px;">
        Added: {{ row.added_on }}
    </p>

    <form method="post">
        <input type="hidden" name="return_to" value="{{ return_to }}">
        <label>Date</label>
        <input type="text" name="date" value="{{ row.date }}">

        <label>Recipient</label>
        <input type="text" name="recipient" value="{{ row.recipient | display_name }}">

        <label>Amount (RM)</label>
        <input type="number" name="amount" value="{{ row.amount }}"
               step="0.01" min="0.01">

        <label>Category</label>
        <select name="category">
            {% for cat in categories %}
            <option value="{{ cat }}" {{ 'selected' if row.category == cat }}>
                {{ cat }}
            </option>
            {% endfor %}
            {% if row.category not in categories %}
            <option value="{{ row.category }}" selected>{{ row.category }}</option>
            {% endif %}
        </select>

        {% set current_source = row.source | source_label if row.source else '' %}
        {% set source_is_custom = current_source and current_source not in sources %}
        <label>Banking app / source</label>
        <select name="source" id="sourceSelect"
                onchange="document.getElementById('customSourceRow').style.display=
                          this.value=='custom'?'block':'none'">
            <option value="">Not specified</option>
            {% for s in sources %}
            <option value="{{ s }}" {{ 'selected' if current_source == s }}>{{ s }}</option>
            {% endfor %}
            <option value="custom" {{ 'selected' if source_is_custom }}>Custom...</option>
        </select>

        <div id="customSourceRow" style="{{ 'display:block;' if source_is_custom else 'display:none;' }}">
            <label>Custom banking app / source</label>
            <input type="text" name="custom_source" value="{{ current_source if source_is_custom else '' }}" placeholder="e.g. Public Bank">
        </div>

        <label>Details</label>
        <textarea name="details" placeholder="Any extra notes about this expense">{{ row.details or '' }}</textarea>

        <button type="submit" name="action" value="save"
                class="btn btn-primary">Save Changes</button>
        <button type="submit" name="action" value="delete"
                class="btn btn-danger"
                onclick="return confirm('Delete this entry?')">Delete Entry</button>
        <a href="{{ return_to }}" class="btn btn-ghost">Cancel</a>
    </form>
</div>

{% endblock %}
