services:
  - type: web
    name: expense-tracker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SHORTCUT_SECRET
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY   # recommended: free-tier Gemini reads receipts + categorises
        sync: false
      - key: GEMINI_MODEL     # optional, defaults to gemini-2.5-flash
        sync: false
